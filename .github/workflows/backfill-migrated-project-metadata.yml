name: Backfill Migrated Project Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-migrated-project-metadata.yml'

permissions:
  contents: read
  issues: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRACKSTORM_PROJECT_TOKEN }}
      PROJECT_OWNER: JonathanGenier
      PROJECT_NUMBER: "2"
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Validate project token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::TRACKSTORM_PROJECT_TOKEN is not configured."; exit 1; }

      - name: Backfill project fields and Jira hierarchy
        shell: bash
        run: |
          set -euo pipefail

          project_json="$(
            gh api graphql               -f query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id fields(first:100){nodes{... on ProjectV2SingleSelectField{id name options{id name}}}}}}}'               -F login="$PROJECT_OWNER"               -F number="$PROJECT_NUMBER"
          )"

          project_id="$(jq -r '.data.user.projectV2.id // empty' <<<"$project_json")"
          test -n "$project_id" || { echo "::error::Could not resolve project #$PROJECT_NUMBER."; exit 1; }

          field_id() {
            jq -r --arg name "$1" '.data.user.projectV2.fields.nodes[] | select(.name==$name) | .id' <<<"$project_json" | head -n1
          }
          option_id() {
            jq -r --arg field "$1" --arg option "$2" '.data.user.projectV2.fields.nodes[] | select(.name==$field) | .options[] | select(.name==$option) | .id' <<<"$project_json" | head -n1
          }

          status_field="$(field_id "Status")"
          work_type_field="$(field_id "Work Type")"
          release_field="$(field_id "Release")"
          test -n "$status_field" && test -n "$work_type_field" && test -n "$release_field" || {
            echo "::error::Expected fields Status, Work Type, Release were not all found."
            exit 1
          }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          : >"$tmp/issues.jsonl"

          page=1
          while :; do
            response="$(gh api "/search/issues?q=repo:$REPOSITORY+is:issue+%22Migrated+from+Jira:%22&per_page=100&page=$page")"
            jq -c '.items[]' <<<"$response" >>"$tmp/issues.jsonl"
            count="$(jq '.items | length' <<<"$response")"
            [ "$count" -eq 100 ] || break
            page=$((page+1))
          done

          issue_count="$(wc -l <"$tmp/issues.jsonl" | tr -d ' ')"
          echo "Found $issue_count migrated Jira issues."
          [ "$issue_count" -gt 0 ] || { echo "::error::No migrated Jira issues found."; exit 1; }

          python - "$tmp/issues.jsonl" "$tmp/map.jsonl" <<'PY'
          import json,re,sys
          src,dst=sys.argv[1:3]
          def grab(body,pat):
              m=re.search(pat,body,re.M)
              return m.group(1).strip() if m else ""
          with open(src,encoding="utf-8") as f, open(dst,"w",encoding="utf-8") as out:
              for line in f:
                  x=json.loads(line)
                  body=x.get("body") or ""
                  row={
                      "jira":grab(body,r"^Migrated from Jira: (TS-\d+)$"),
                      "number":x["number"],
                      "node":x["node_id"],
                      "state":x.get("state",""),
                      "type":grab(body,r"^Legacy Jira type: (.+)$"),
                      "legacy_status":grab(body,r"^Legacy Jira status: (.+)$"),
                      "parent":grab(body,r"^Legacy Jira parent: (TS-\d+)$"),
                      "release":grab(body,r"^Legacy release: ([0-9]+\.[0-9]+\.[0-9]+)$"),
                  }
                  if row["jira"]:
                      out.write(json.dumps(row,separators=(",",":"))+"\n")
          PY

          declare -A jira_number jira_node
          while IFS= read -r row; do
            jira="$(jq -r '.jira' <<<"$row")"
            jira_number["$jira"]="$(jq -r '.number' <<<"$row")"
            jira_node["$jira"]="$(jq -r '.node' <<<"$row")"
          done <"$tmp/map.jsonl"

          set_select() {
            local item="$1" field="$2" option="$3" label="$4"
            test -n "$option" || { echo "::error::Project option missing for $label."; return 1; }
            gh api graphql               -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'               -F project="$project_id" -F item="$item" -F field="$field" -f option="$option" >/dev/null
          }

          updated=0
          linked=0

          while IFS= read -r row; do
            jira="$(jq -r '.jira' <<<"$row")"
            number="$(jq -r '.number' <<<"$row")"
            node="$(jq -r '.node' <<<"$row")"
            state="$(jq -r '.state' <<<"$row")"
            type="$(jq -r '.type' <<<"$row")"
            legacy_status="$(jq -r '.legacy_status' <<<"$row")"
            parent="$(jq -r '.parent' <<<"$row")"
            release="$(jq -r '.release' <<<"$row")"

            item_id="$(
              gh api graphql                 -f query='query($id:ID!){node(id:$id){... on Issue{projectItems(first:100){nodes{id project{id}}}}}}'                 -F id="$node"                 --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$project_id\") | .id" | head -n1
            )"
            if [ -z "$item_id" ]; then
              item_id="$(
                gh api graphql                   -f query='mutation($project:ID!,$content:ID!){addProjectV2ItemById(input:{projectId:$project,contentId:$content}){item{id}}}'                   -F project="$project_id" -F content="$node"                   --jq '.data.addProjectV2ItemById.item.id'
              )"
            fi

            set_select "$item_id" "$work_type_field" "$(option_id "Work Type" "$type")" "Work Type=$type for $jira"

            status_value="Backlog"
            if [ "$state" = "closed" ] || [ "$legacy_status" = "Done" ]; then
              status_value="Done"
            elif [ "$legacy_status" = "In Progress" ]; then
              status_value="In Progress"
            elif [ "$legacy_status" = "In Review" ]; then
              status_value="In Review"
            elif [ "$legacy_status" = "To Do" ]; then
              status_value="To do"
            fi
            set_select "$item_id" "$status_field" "$(option_id "Status" "$status_value")" "Status=$status_value for $jira"

            if [ -n "$release" ]; then
              set_select "$item_id" "$release_field" "$(option_id "Release" "$release")" "Release=$release for $jira"
            fi

            if [ -n "$parent" ] && [ -n "${jira_node[$parent]:-}" ]; then
              parent_node="${jira_node[$parent]}"
              current_parent="$(
                gh api graphql                   -f query='query($id:ID!){node(id:$id){... on Issue{parent{id}}}}'                   -F id="$node" --jq '.data.node.parent.id // empty'
              )"
              if [ "$current_parent" != "$parent_node" ]; then
                gh api graphql                   -f query='mutation($parent:ID!,$child:ID!){addSubIssue(input:{issueId:$parent,subIssueId:$child,replaceParent:true}){issue{id} subIssue{id}}}'                   -F parent="$parent_node" -F child="$node" >/dev/null
                linked=$((linked+1))
              fi
            fi

            updated=$((updated+1))
            echo "Backfilled $jira -> #$number ($type, $status_value${release:+, release $release})."
          done <"$tmp/map.jsonl"

          echo "Backfill complete: $updated project items updated; $linked parent relationships added/replaced."
