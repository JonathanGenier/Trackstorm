name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

    steps:
      - name: Checkout Story PR with version history
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ts-')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Checkout current revision
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'ts-')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Restore Git LFS object cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: trackstorm-lfs-${{ runner.os }}-${{ hashFiles('**/*.mov', '**/*.ogv') }}

      - name: Materialize Git LFS media
        shell: pwsh
        run: git lfs pull

      - name: Validate Story version and synchronized export preset against current main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'ts-')
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch current main for version validation.' }
          ./tools/check-version.ps1

      - name: Verify .NET 10 SDK
        shell: pwsh
        run: |
          $version = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^10\.0\.') {
            throw "Trackstorm CI requires a .NET 10 SDK; selected '$version'."
          }
          Write-Host "Using preinstalled .NET SDK $version."

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: trackstorm-nuget-${{ runner.os }}-net10-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      - name: Prepare pinned EOS SDK
        run: ./setup-eos.ps1

      - name: Comprehensive verification
        shell: pwsh
        run: ./check.ps1

      - name: Prepare pinned Godot
        id: godot
        shell: pwsh
        run: |
          $godot = ./tools/setup-godot-ci.ps1
          "path=$godot" >> $env:GITHUB_OUTPUT

      - name: Import Godot project
        shell: pwsh
        run: ./import-godot.ps1 -GodotPath "${{ steps.godot.outputs.path }}"

      - name: Godot startup smoke
        shell: pwsh
        run: ./check-startup.ps1 -GodotPath "${{ steps.godot.outputs.path }}" -SkipBuild -SkipMediaCheck

  revalidate-open-prs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Re-run completed CI for open PRs targeting main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --limit 100 \
            --json number,headRefOid \
            --jq '.[] | [.number, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha; do
            [ -n "$pr_number" ] || continue

            run_json="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow CI \
                --event pull_request \
                --commit "$head_sha" \
                --limit 1 \
                --json databaseId,status
            )"

            run_id="$(jq -r '.[0].databaseId // empty' <<<"$run_json")"
            run_status="$(jq -r '.[0].status // empty' <<<"$run_json")"

            if [ -z "$run_id" ]; then
              echo "PR #$pr_number: no Pull Request CI run found; skipping."
              continue
            fi

            if [ "$run_status" != "completed" ]; then
              echo "PR #$pr_number: latest CI run is $run_status; waiting before revalidation."
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status || true
            fi

            echo "PR #$pr_number: re-running CI run $run_id against current main."
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
          done
