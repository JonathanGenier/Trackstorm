name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Version rule regression tests
        run: ./tools/test-version.ps1

      - name: Require Story revision or authorized release transition against current main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch current main for version validation.' }
          ./tools/check-version.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: ./setup-eos.ps1
      - run: dotnet restore Trackstorm.sln
      - run: dotnet format Trackstorm.sln --verify-no-changes --no-restore
      - run: dotnet build Trackstorm.sln -c Release --warnaserror --no-restore
      - run: dotnet test code/Tests/Trackstorm.Core.Tests.csproj -c Release --no-build
      - run: dotnet test code/TransportTests/Trackstorm.Transport.Tests.csproj -c Release --no-build --filter 'TestCategory!=Native'
