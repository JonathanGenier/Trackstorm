name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Trackstorm.sln
      - run: dotnet format Trackstorm.sln --verify-no-changes --no-restore
      - run: dotnet build Trackstorm.sln -c Release --warnaserror --no-restore
      - run: dotnet test code/Tests/Trackstorm.Core.Tests.csproj -c Release --no-build
