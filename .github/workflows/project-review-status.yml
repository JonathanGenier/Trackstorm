name: Sync Project Review Status

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  move-linked-issue-to-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRACKSTORM_PROJECT_TOKEN }}
      PROJECT_OWNER: JonathanGenier
      PROJECT_NUMBER: "2"
      PROJECT_STATUS: In Review
      REPOSITORY: ${{ github.repository }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Validate project token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Repository secret TRACKSTORM_PROJECT_TOKEN is not configured."
            exit 1
          fi

      - name: Move closing issues to In Review
        shell: bash
        run: |
          set -euo pipefail

          issue_numbers="$(
            python - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          pattern = re.compile(
              r"(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b"
          )
          numbers = []
          for match in pattern.finditer(body):
              number = match.group(1)
              if number not in numbers:
                  numbers.append(number)
          print("\n".join(numbers))
          PY
          )"

          if [ -z "$issue_numbers" ]; then
            echo "No closing issue reference found in PR body; nothing to update."
            exit 0
          fi

          project_json="$(
            gh api graphql               -f query='
                query($login: String!, $number: Int!) {
                  user(login: $login) {
                    projectV2(number: $number) {
                      id
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }'               -F login="$PROJECT_OWNER"               -F number="$PROJECT_NUMBER"
          )"

          project_id="$(jq -r '.data.user.projectV2.id // empty' <<<"$project_json")"
          status_field_id="$(
            jq -r --arg status_name "Status" '
              .data.user.projectV2.fields.nodes[]
              | select(.name == $status_name)
              | .id
            ' <<<"$project_json" | head -n 1
          )"
          status_option_id="$(
            jq -r --arg status_name "Status" --arg option_name "$PROJECT_STATUS" '
              .data.user.projectV2.fields.nodes[]
              | select(.name == $status_name)
              | .options[]
              | select(.name == $option_name)
              | .id
            ' <<<"$project_json" | head -n 1
          )"

          if [ -z "$project_id" ] || [ -z "$status_field_id" ] || [ -z "$status_option_id" ]; then
            echo "::error::Could not resolve Trackstorm Development project, Status field, or In Review option."
            exit 1
          fi

          while IFS= read -r issue_number; do
            [ -n "$issue_number" ] || continue

            issue_json="$(gh api "repos/$REPOSITORY/issues/$issue_number")"
            if jq -e '.pull_request != null' >/dev/null <<<"$issue_json"; then
              echo "::warning::#$issue_number is a pull request, not an issue; skipping."
              continue
            fi

            issue_id="$(jq -r '.node_id' <<<"$issue_json")"

            item_id="$(
              gh api graphql                 -f query='
                  query($id: ID!) {
                    node(id: $id) {
                      ... on Issue {
                        projectItems(first: 100) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }'                 -F id="$issue_id"                 --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$project_id\") | .id"                 | head -n 1
            )"

            if [ -z "$item_id" ]; then
              item_id="$(
                gh api graphql                   -f query='
                    mutation($project: ID!, $content: ID!) {
                      addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                        item {
                          id
                        }
                      }
                    }'                   -F project="$project_id"                   -F content="$issue_id"                   --jq '.data.addProjectV2ItemById.item.id'
              )"
            fi

            gh api graphql               -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $project
                      itemId: $item
                      fieldId: $field
                      value: {singleSelectOptionId: $option}
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }'               -F project="$project_id"               -F item="$item_id"               -F field="$status_field_id"               -F option="$status_option_id"               >/dev/null

            echo "Moved issue #$issue_number to $PROJECT_STATUS."
          done <<<"$issue_numbers"
