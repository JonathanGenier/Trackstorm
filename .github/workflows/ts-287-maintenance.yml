name: TS-287 maintenance validation
on:
  push:
    branches: [ts-287-jg]
permissions:
  contents: write
  actions: read
concurrency:
  group: ts-287-maintenance
  cancel-in-progress: true
jobs:
  package:
    if: github.repository == 'JonathanGenier/Trackstorm' && github.ref == 'refs/heads/ts-287-jg'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Retrieve completed verification without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 37699925566 --repo $env:GITHUB_REPOSITORY --name ts-287-delivery-0503a64a168432b7f113c4c710bb4a4f8874166e --dir .godot/ts-287-final
          if ($LASTEXITCODE -ne 0) { throw 'Completed evidence could not be retrieved.' }
      - name: Reconstruct only tested files and save a complete delivery archive
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, json, subprocess, textwrap, zipfile
          root=Path.cwd(); folder=root/'.godot/ts-287-final'
          prior='0503a64a168432b7f113c4c710bb4a4f8874166e'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          delta=subprocess.check_output(['git','diff','--name-only',prior,'HEAD','--'],text=True).splitlines()
          if delta!=['.github/workflows/ts-287-maintenance.yml']: raise SystemExit('Concurrent source change: '+str(delta))
          driver=subprocess.check_output(['git','show',prior+':.github/workflows/ts-287-maintenance.yml'],text=True,encoding='utf-8')
          def prior_python_step(name):
              section=driver.split('      - name: '+name+'\n',1)[1].split('\n      - name:',1)[0]
              code=section.split('        run: |\n',1)[1]
              return textwrap.dedent(code)
          with zipfile.ZipFile(folder/'source.zip') as z:
              manifest=json.loads(z.read('manifest.json'))
              if manifest['head']!='a82eb4a5bca29cf55629f5b3e037e8ec5acdfd53': raise SystemExit('Wrong source snapshot.')
              present=set()
              for n in z.namelist():
                  if not n.startswith('source/'): continue
                  name=n[7:]; p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('Unsafe archive path.')
                  target=root/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(z.read(n)); present.add(name)
              for name in manifest['changed']:
                  if name not in present:
                      if name not in ['.github/workflows/ts-287-maintenance.yml','tools/ts-287-apply.py','tools/ts-287-finish.py']: raise SystemExit('Unexpected deletion: '+name)
                      (root/name).unlink(missing_ok=True)
          # Reapply exactly the generated-output boundary already checked in run 37699925566.
          code=prior_python_step('Confirm exact tested source and classify generated textures')
          code=code[code.index("models=['BoulderLow'"):]
          exec(compile(code,'verified-ignore-boundary','exec'),globals())
          records=json.loads((folder/'results.json').read_text(encoding='utf-8-sig'))
          required={'Final tooling and exact generated-output ignores','Final check.ps1 after ignore/test-only correction'}
          if required!={r['Name'] for r in records if r['Name'] in required and r['Status']=='PASS'}: raise SystemExit('Final checked evidence is absent.')
          if len(records)!=15: raise SystemExit('Unexpected result count; inspect instead of rewriting evidence.')
          # Run only the previously reviewed report/index generation, before any publication code.
          code=prior_python_step('Persist evidence and create reviewable commit without updating a ref')
          code=code.split("subprocess.run(['git','diff','--check'],check=True)",1)[0]
          exec(compile(code,'verified-evidence-report','exec'),globals())
          subprocess.run(['git','diff','--check'],check=True)
          paths=set(subprocess.check_output(['git','diff','--name-only','-z','HEAD','--']).decode().split('\0'))
          paths.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')); paths.discard('')
          fixed={'.gitignore','AGENTS.md','Directory.Build.props','export_presets.cfg','.github/workflows/ci.yml','.github/workflows/extended-ci.yml','.github/workflows/ts-287-maintenance.yml','tools/ts-287-apply.py','tools/ts-287-finish.py','tools/test-agent-tools.ps1','tools/fast-check-routes.ps1','tools/test-workflow-tools.ps1','docs/critique.md','docs/verification/ts-287.md','docs/verification/ts-287-results.json','docs/verification/README.md','check-car-articulation.ps1','check-developer-options.ps1','check-menu.ps1','check-settings.ps1','check-vehicle.ps1','check-input.ps1','check-gdunit.ps1'}
          for p in paths:
              if p not in fixed and not p.startswith(('docs/workflow','docs/features/')): raise SystemExit('Unexpected delivery path: '+p)
          entries=[]
          with zipfile.ZipFile(folder/'delivery-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(paths):
                  entry={'path':p,'mode':'100644','type':'blob','sha':None}
                  if Path(p).is_file():
                      data=Path(p).read_bytes(); entry['sha']=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(); z.write(p,'source/'+p)
                  entries.append(entry)
              z.writestr('manifest.json',json.dumps({'parent':head,'baseTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'entries':entries},indent=2))
          (folder/'delivery-entries.json').write_text(json.dumps(entries,indent=2),encoding='utf-8')
          print('DELIVERY_PARENT='+head)
          print('DELIVERY_BASE_TREE='+subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          print('Completed source archive saved before object uploads. No tests rerun or results reclassified.')
      - name: Upload ordinary content objects only; no tree, commit, workflow or ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import base64,json,os,urllib.request
          folder=Path('.godot/ts-287-final')
          entries=json.loads((folder/'delivery-entries.json').read_text())
          for entry in entries:
              if entry['sha'] is None: continue
              data=Path(entry['path']).read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: uploaded=json.load(response)['sha']
              if uploaded!=entry['sha']: raise SystemExit('Blob identity mismatch: '+entry['path'])
              print('BLOB '+entry['path']+' '+uploaded)
          print('DELIVERY_ENTRIES='+json.dumps(entries,separators=(',',':')))
          print('All source bytes retained. No tree, commit, branch or PR was changed by this job.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-287-publish-${{ github.sha }}
          path: .godot/ts-287-final/
          include-hidden-files: true
          if-no-files-found: error
