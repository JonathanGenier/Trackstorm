name: TS-287 maintenance validation

on:
  push:
    branches: [ts-287-jg]

permissions:
  contents: write
  actions: read

concurrency:
  group: ts-287-maintenance
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'JonathanGenier/Trackstorm' && github.ref == 'refs/heads/ts-287-jg'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Reuse actual unchanged-source evidence and apply exact maintenance patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ts-287-finish.py previous
          if ($LASTEXITCODE -ne 0) { throw 'Prior evidence/source validation failed.' }
          python tools/ts-287-apply.py
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance patch refused unexpected source structure.' }
          ./tools/sync-story-version.ps1
          ./tools/check-version.ps1 -StoryBranch ts-287-jg
      - name: Prepare existing pinned prerequisites
        shell: pwsh
        run: |
          git lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'Media materialization failed.' }
          ./setup-eos.ps1
          $godot = ./tools/setup-godot-ci.ps1
          "GODOT_PATH=$godot" >> $env:GITHUB_ENV
      - name: Exercise automatic runtime batch, remaining wrappers and unchanged-main baseline
        shell: pwsh
        run: |
          . ./tools/agent-checks.ps1
          $root = $PWD.Path
          $folder = Join-Path $root '.godot/ts-287-checks'
          $results = [Collections.Generic.List[object]]::new()
          foreach ($entry in @(Get-Content (Join-Path $folder 'results.json') -Raw | ConvertFrom-Json)) { $results.Add($entry) }
          function Run-Evidence([string]$Name, [string]$Executable, [hashtable]$Parameters = @{}, [switch]$AllowFailure, [string]$WorkingDirectory = $root) {
            $result = Invoke-AgentCheck -Name $Name -Executable $Executable -Parameters $Parameters -Root $WorkingDirectory -LogDirectory $folder
            $result | Add-Member NoteProperty Run "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $results.Add($result)
            $results.ToArray() | ConvertTo-Json -Depth 8 -AsArray | Set-Content (Join-Path $folder 'results.json')
            if ($result.Status -ne 'PASS' -and -not $AllowFailure) { throw "$Name failed." }
          }
          Run-Evidence 'Fresh Client build through check-fast' (Join-Path $root 'tools/check-fast.ps1') @{ Area = 'Client' }
          Run-Evidence 'Fresh native import' (Join-Path $root 'import-godot.ps1') @{ GodotPath = $env:GODOT_PATH }
          Run-Evidence 'check-fast.ps1 automatic runtime batch' (Join-Path $root 'tools/check-fast.ps1') @{ GodotPath = $env:GODOT_PATH; RequireRuntime = $true; Explain = $true; OutputDirectory = (Join-Path $root '.godot/ts-287-auto') } -AllowFailure
          $auto = Get-Content (Join-Path $root '.godot/ts-287-auto/results.json') -Raw | ConvertFrom-Json
          if (-not @($auto.Checks | Where-Object { $_.Name -eq 'Runtime Debug build' -and $_.Status -eq 'PASS' }).Count) { throw 'The automatic runtime batch did not prepare a fresh build.' }
          foreach ($script in @('check-input.ps1', 'check-settings.ps1', 'check-menu.ps1', 'check-developer-options.ps1', 'check-vehicle.ps1', 'check-gdunit.ps1')) {
            Run-Evidence "$script -NoBuild" (Join-Path $root $script) @{ GodotPath = $env:GODOT_PATH; NoBuild = $true }
          }
          $baseline = Join-Path $env:RUNNER_TEMP ('ts-287-main-' + [guid]::NewGuid().ToString('N'))
          git worktree add --detach $baseline 73c6811b56cc8ae3b05229d66b7ffdfcb0ab2911
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare isolated baseline checkout.' }
          Push-Location $baseline
          try {
            git lfs pull
            if ($LASTEXITCODE -ne 0) { throw 'Baseline media preparation failed.' }
            ./setup-eos.ps1
            dotnet build Trackstorm.Client.csproj -c Debug -warnaserror
            if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed.' }
            ./import-godot.ps1 -GodotPath $env:GODOT_PATH
            Run-Evidence 'Unchanged main check-car-articulation.ps1' (Join-Path $baseline 'check-car-articulation.ps1') @{ GodotPath = $env:GODOT_PATH } -AllowFailure -WorkingDirectory $baseline
          }
          finally { Pop-Location }
          Run-Evidence 'Final version validation' (Join-Path $root 'tools/check-version.ps1') @{ StoryBranch = 'ts-287-jg' }
      - name: Propose final tree with truthful baseline limitation and no ref update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ts-287-finish.py publish
          if ($LASTEXITCODE -ne 0) { throw 'Final candidate publication refused unexpected results.' }
      - name: Retain actual validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-287-validation-${{ github.sha }}
          path: |
            .godot/ts-287-checks/
            .godot/ts-287-auto/
          include-hidden-files: true
          if-no-files-found: ignore
