name: TS-287 maintenance validation

on:
  push:
    branches: [ts-287-jg]
    paths:
      - '.github/workflows/ts-287-maintenance.yml'
      - 'tools/ts-287-apply.py'

permissions:
  contents: read

concurrency:
  group: ts-287-maintenance
  cancel-in-progress: true

jobs:
  inspect:
    if: github.repository == 'JonathanGenier/Trackstorm' && github.ref == 'refs/heads/ts-287-jg'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Inspect maintenance inputs
        shell: python
        run: |
          from pathlib import Path
          import re
          for directory in ('tools', 'docs', '.github'):
              for path in Path(directory).rglob('AGENTS.md'):
                  print(f'INSTRUCTIONS {path}\n{path.read_text(encoding="utf-8-sig")}')
          for name in ('items', 'vehicles', 'developer-options'):
              path = Path(f'docs/features/{name}.md')
              text = path.read_text(encoding='utf-8-sig')
              print(f'\nDOCUMENT {path}: {len(text.encode("utf-8"))} bytes')
              for match in re.finditer(r'^#{1,3} .+$', text, re.M):
                  print(match.group())
          print('\nHARNESS BUILD CONTRACTS')
          for path in sorted(Path('.').glob('check-*.ps1')):
              lines = path.read_text(encoding='utf-8-sig').splitlines()
              print(f'\n{path}')
              print('\n'.join(lines[:12]))
              for i, line in enumerate(lines):
                  if re.search(r'dotnet (build|test|restore)|SkipBuild|NoBuild', line):
                      print(f'{i+1}: {line}')
          print('\nCURRENT CI TOOLS')
          for path in ('tools/test-workflow-tools.ps1', 'tools/check-version.ps1', 'tools/check-root-artifacts.ps1'):
              print(f'\nFILE {path}\n{Path(path).read_text(encoding="utf-8-sig")}')
      - name: Verify available interpreter versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          dotnet --version
          git --version
